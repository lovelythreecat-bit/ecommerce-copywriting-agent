[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-copy-agent"
version = "0.2.1"
description = "Reusable ecommerce copywriting agent"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3",
    "pydantic>=2.9,<3",
    "openai>=1",
    "pillow>=10",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_copy_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
