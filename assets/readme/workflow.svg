<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">电商文案的检索与四阶段编辑流程</title>
  <desc id="desc">商品资料与写作要求先经过本地营销资料检索，再依次交给策划、初稿、审稿与定稿。默认资料检索不是实时联网搜索。</desc>
  <rect width="1200" height="400" rx="20" fill="#f3f6fa"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <g id="input-and-retrieval" fill="#475569" font-size="48">
      <text x="64" y="90">商品输入</text>
      <path d="M294 72 H355 M340 58 L355 72 L340 86" fill="none" stroke="#64748b" stroke-width="4"/>
      <text x="390" y="90">本地资料检索</text>
    </g>
    <path d="M535 122 V145 H178 V172" fill="none" stroke="#64748b" stroke-width="4"/>
    <path d="M164 157 L178 172 L192 157" fill="none" stroke="#64748b" stroke-width="4"/>
    <g id="writing-stages" font-size="52" font-weight="600" text-anchor="middle">
      <rect x="64" y="196" width="228" height="126" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="178" y="276" fill="#334155">策划</text>
      <rect x="346" y="196" width="228" height="126" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="460" y="276" fill="#334155">初稿</text>
      <rect x="628" y="196" width="228" height="126" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="742" y="276" fill="#334155">审稿</text>
      <rect x="910" y="196" width="228" height="126" rx="12" fill="#2563eb"/>
      <text x="1024" y="276" fill="#fff">定稿</text>
    </g>
    <g id="stage-connections" fill="none" stroke="#64748b" stroke-width="4">
      <path d="M300 259 H332 M320 247 L332 259 L320 271"/>
      <path d="M582 259 H614 M602 247 L614 259 L602 271"/>
      <path d="M864 259 H896 M884 247 L896 259 L884 271"/>
    </g>
  </g>
</svg>

