<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">从商品资料到可审查的电商文案</title>
  <desc id="desc">商品资料与写作要求先经过本地营销资料检索，再依次完成策划、初稿、审稿和定稿。输出正文、待核实提示、阶段产物、来源与调用统计。默认检索不是实时联网搜索。</desc>
  <rect width="1200" height="420" rx="16" fill="#f3f6fa"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <g id="input-and-retrieval" fill="#153458" font-size="42" font-weight="600">
      <text x="64" y="88">商品资料与要求</text>
      <path d="M400 72 H478 M460 56 L478 72 L460 88" fill="none" stroke="#54647b" stroke-width="3"/>
      <text x="516" y="88">本地资料检索</text>
    </g>
    <path d="M642 116 V148 H178 V181" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <path d="M166 168 L178 181 L190 168" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <g id="writing-stages" font-size="52" font-weight="600" text-anchor="middle">
      <rect x="64" y="196" width="228" height="126" rx="10" fill="#fff"/>
      <text x="178" y="276" fill="#153458">策划</text>
      <rect x="346" y="196" width="228" height="126" rx="10" fill="#fff"/>
      <text x="460" y="276" fill="#153458">初稿</text>
      <rect x="628" y="196" width="228" height="126" rx="10" fill="#fff"/>
      <text x="742" y="276" fill="#153458">审稿</text>
      <rect x="910" y="196" width="228" height="126" rx="10" fill="#255cba"/>
      <text x="1024" y="276" fill="#fff">定稿</text>
    </g>
    <g id="stage-connections" fill="none" stroke="#54647b" stroke-width="3">
      <path d="M300 259 H332 M320 247 L332 259 L320 271"/>
      <path d="M582 259 H614 M602 247 L614 259 L602 271"/>
      <path d="M864 259 H896 M884 247 L896 259 L884 271"/>
    </g>
    <text id="result-summary" x="64" y="382" font-size="32" fill="#54647b">返回正文 · 待核实提示 · 阶段产物 · 来源与调用统计</text>
  </g>
</svg>

